[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Elephant1214/glowbsidian"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.23"
bytes = "1.12"
flate2 = "1.1"
num_enum = "0.7"
rand = "0.10"
serde = "1.0"
serde_with = "3.24"
serde_json = "1.0"
socket2 = "0.6"
thiserror = "2.0"
tokio = "1.54"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = "1.29"

glowbsidian-proto = { path = "crates/proto" }
glowbsidian-raknet = { path = "crates/raknet" }
glowbsidian = { path = "crates/server" }

[profile.dev.package."*"]
opt-level = 2
